version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: unicampus_pg_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unicampus_unified}
      POSTGRES_USER: ${POSTGRES_USER:-unicampus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unicampus_super_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: unicampus_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unicampus_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-unicampus_unified}
      - POSTGRES_USER=${POSTGRES_USER:-unicampus_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-unicampus_super_password_2026}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unicampus_celery_worker
    restart: always
    command: celery -A app.core.celery_app worker -l info
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-unicampus_unified}
      - POSTGRES_USER=${POSTGRES_USER:-unicampus_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-unicampus_super_password_2026}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - backend
      - redis

volumes:
  pg_data:
  backend_uploads: