# /etc/nginx/conf.d/taskmanager-limits.conf
# Лимиты запросов. Сотрудники офиса могут сидеть за одним IP,
# поэтому значения мягкие: они режут ботов, но не мешают людям.
limit_req_zone  $binary_remote_addr zone=tm_login:10m   rate=10r/m;
limit_req_zone  $binary_remote_addr zone=tm_general:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=tm_perip:10m;
limit_req_status  429;
limit_conn_status 429;
