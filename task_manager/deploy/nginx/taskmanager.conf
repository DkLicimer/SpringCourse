# /etc/nginx/sites-available/taskmanager
# __DOMAIN__ подставляется скриптом setup-server.sh. HTTPS добавляет certbot.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self)" always;
    # HSTS браузеры учитывают только по HTTPS
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Типичные пробы сканеров — сразу обрываем (на этом сайте нет PHP и т.п.)
    location ~* \.(php|asp|aspx|jsp|cgi)$ { return 444; }
    location ~* ^/(wp-admin|wp-login|wp-content|xmlrpc|phpmyadmin|cgi-bin|vendor|actuator) { return 444; }
    # Оптимизатор картинок Next.js не используется (next/image в проекте нет) — закрываем его
    # (защита от уязвимостей этого модуля).
    location ^~ /_next/image { return 404; }
    # Скрытые файлы (.env, .git ...), кроме .well-known для certbot
    location ~ /\.(?!well-known) { return 404; }

    # Вход: строгий лимит от перебора паролей
    location = /api/auth/callback/credentials {
        limit_req zone=tm_login burst=10 nodelay;
        include /etc/nginx/proxy_app.conf;
    }

    location / {
        limit_req zone=tm_general burst=100 nodelay;
        limit_conn tm_perip 60;
        include /etc/nginx/proxy_app.conf;
    }
}
