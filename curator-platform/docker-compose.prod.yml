version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: curator_prod_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-curator_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-curator_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - curator_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: curator_prod_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-curator_admin}:${POSTGRES_PASSWORD:-secure_password_123}@db:5432/${POSTGRES_DB:-curator_db}
      SECRET_KEY: ${SECRET_KEY:-zabgu_super_secret_jwt_key_2026}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - db
    networks:
      - curator_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: curator_prod_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - curator_network

volumes:
  postgres_prod_data:
  uploads_data:

networks:
  curator_network:
    driver: bridge