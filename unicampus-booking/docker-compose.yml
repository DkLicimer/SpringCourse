services:
  db:
    image: postgres:16-alpine
    container_name: unicampus_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unicampus_db}
      POSTGRES_USER: ${POSTGRES_USER:-unicampus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unicampus_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: unicampus_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: unicampus_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-unicampus_db}
      - POSTGRES_USER=${POSTGRES_USER:-unicampus_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-unicampus_secret}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis

  celery_worker:
    build: ./backend
    container_name: unicampus_celery_worker
    restart: always
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-unicampus_db}
      - POSTGRES_USER=${POSTGRES_USER:-unicampus_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-unicampus_secret}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis

  celery_beat:
    build: ./backend
    container_name: unicampus_celery_beat
    restart: always
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-unicampus_db}
      - POSTGRES_USER=${POSTGRES_USER:-unicampus_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-unicampus_secret}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - backend
      - redis

  frontend:
    build: ./frontend
    container_name: unicampus_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media: