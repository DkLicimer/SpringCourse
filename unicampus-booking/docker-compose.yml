services:
  db:
    image: postgres:16-alpine
    container_name: unicampus_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unicampus_db}
      POSTGRES_USER: ${POSTGRES_USER:-unicampus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unicampus_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Блок ports удален — никаких конфликтов с портами Windows больше не будет

  backend:
    build: ./backend
    container_name: unicampus_backend
    restart: always
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-unicampus_db}
      - POSTGRES_USER=${POSTGRES_USER:-unicampus_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-unicampus_secret}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-insecure_dev_key_change_in_production}
      - ALLOWED_HOSTS=*
      - CSRF_TRUSTED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: unicampus_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:

networks:
  default:
    name: unicampus_network